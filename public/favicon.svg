<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#D9645B"/>
  <!-- classic karaoke handheld mic -->
  <g transform="rotate(-32 31 33)">
    <!-- tapered handle -->
    <path d="M27.5 28h9l1.5 26h-12L27.5 28z" fill="#FFF8F0"/>
    <rect x="26.5" y="28" width="11" height="26" rx="5.5" fill="#FFF8F0"/>
    <!-- neck band -->
    <rect x="25.5" y="29.5" width="13" height="4.5" rx="2.2" fill="#FFC23D"/>
    <!-- ball grille head -->
    <circle cx="31" cy="18" r="12.5" fill="#FFF8F0"/>
    <!-- mesh: horizontal -->
    <path d="M21.5 12.5h19M20.8 16h20.4M20.5 19.5h21M20.8 23h20.4M22 26.2h18" stroke="#D9645B" stroke-width="1.35" stroke-linecap="round" opacity="0.5"/>
    <!-- mesh: vertical hint -->
    <path d="M31 8.5v16.5" stroke="#D9645B" stroke-width="1.2" stroke-linecap="round" opacity="0.35"/>
  </g>
  <!-- sound waves -->
  <path d="M47 16c2.6 2.1 2.6 6.6 0 8.7" stroke="#FFC23D" stroke-width="3" stroke-linecap="round"/>
  <path d="M52.5 12.5c4 3.3 4 11 0 14.3" stroke="#FFC23D" stroke-width="3" stroke-linecap="round"/>
</svg>
